# build.yml — testes e instaladores do Consulta Estoque (Windows)
# v1.3.0 — Autor: Ruda Gabriel
# Gera, a cada push e PR:
#   - moderno: Windows 10/11, 64 bits (Electron 44)
#   - legado:  Windows 7 a 11, 64 e 32 bits (Electron 22)
# Os arquivos ficam em "Artifacts" de cada execução (aba Actions).
# Publicação (aba Releases do repositório): a cada push na main com uma versão
# nova no package.json, cria a tag "v<versão>" e publica a Release com os
# instaladores e as versões portáteis. Uma tag "v*" enviada à mão também publica.
name: build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm test

  instaladores:
    needs: testes
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variante: moderno
            archs: --x64
          - variante: legado
            archs: --x64 --ia32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Downloads do Electron/electron-builder guardados entre execuções (menos rede, menos falha).
      - uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ matrix.variante }}-${{ hashFiles('package-lock.json', 'electron-builder.config.js') }}
          restore-keys: electron-${{ matrix.variante }}-
      - name: Gerar instalador e versão portátil
        shell: bash
        env:
          VARIANTE: ${{ matrix.variante }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        # Até 3 tentativas: queda de rede no download do Electron (ECONNRESET) não derruba a versão.
        run: |
          for t in 1 2 3; do
            npx electron-builder --config electron-builder.config.js --win nsis portable ${{ matrix.archs }} --publish never && exit 0
            echo "Tentativa $t falhou (rede instável?) — tentando de novo em 20 s..."
            sleep 20
          done
          exit 1
      - name: Conferir que o aplicativo empacotado abre (modo demonstração)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Recurse -Filter "Consulta Estoque.exe" | Where-Object { $_.FullName -match "win-unpacked" } | Select-Object -First 1
          if (-not $exe) { throw "executável não encontrado" }
          $dados = "$env:RUNNER_TEMP\dados-teste"
          $env:CONSULTA_DESKTOP_DADOS = $dados
          $env:CONSULTA_SEM_QUIOSQUE = "1"
          $log = "$dados\consulta-estoque.log"
          function Abrir($n) {
            $chromium = "$env:RUNNER_TEMP\chromium-$n.log"
            $p = Start-Process -FilePath $exe.FullName -ArgumentList "--demo", "--enable-logging=file", "--log-file=$chromium" -PassThru
            Start-Sleep -Seconds 25
            $caiu = $p.HasExited
            if ($caiu) { Write-Host "Abertura $n caiu (código $($p.ExitCode)). Log do Chromium:"; if (Test-Path $chromium) { Get-Content $chromium -Tail 40 } }
            else { Stop-Process -Id $p.Id -Force; Start-Sleep -Seconds 2 }
            return -not $caiu
          }
          $ok = Abrir 1
          # Se a 1ª abertura cair (máquina virtual sem placa de vídeo), a 2ª tem
          # de abrir sozinha no modo seguro — o mesmo que acontece no cliente,
          # onde o vigia reabre o aplicativo.
          if (-not $ok) {
            $ok = Abrir 2
            if ($ok -and -not (Select-String -Path $log -Pattern "sem aceleração gráfica" -Quiet)) { throw "a 2ª abertura não usou o modo seguro" }
          }
          if (Test-Path $log) { Get-Content $log }
          if (-not $ok) { throw "o aplicativo não abriu nem no modo seguro" }
          if (-not (Select-String -Path $log -Pattern "Estoque carregado" -Quiet)) { throw "o estoque de demonstração não carregou" }
      - uses: actions/upload-artifact@v4
        with:
          name: ConsultaEstoque-${{ matrix.variante }}
          path: |
            dist/**/*.exe
            !dist/**/win-unpacked/**
            !dist/**/win-ia32-unpacked/**
          if-no-files-found: error

  publicar:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: instaladores
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: arquivos
          merge-multiple: true
      - name: Versão a publicar
        id: versao
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="${GITHUB_REF_NAME}"; else tag="v$(node -p "require('./package.json').version")"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          find arquivos -type f -name "*.exe" -printf "%f  %s bytes\n"
          esperados=$(find arquivos -type f -name "*.exe" -printf "%f\n" | sort)
          # Release que já tem TODOS os arquivos: nada a fazer. Se faltar algum
          # (envio interrompido), publica de novo e completa.
          publicados=$(gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null | sort || true)
          faltando=$(comm -23 <(echo "$esperados") <(echo "$publicados") | grep -c . || true)
          if [ -n "$publicados" ] && [ "$faltando" = "0" ]; then
            echo "A Release $tag já tem todos os arquivos — nada a publicar."
            echo "publicar=nao" >> "$GITHUB_OUTPUT"
          else
            echo "Publicando a Release $tag ($faltando arquivo(s) faltando)."
            echo "publicar=sim" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        if: steps.versao.outputs.publicar == 'sim'
        with:
          tag_name: ${{ steps.versao.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Consulta Estoque ${{ steps.versao.outputs.tag }}
          overwrite_files: true
          body: |
            **Qual baixar?**
            - Windows 10/11 64 bits: `...-win10-11-x64-instalador.exe` (instala) ou `...-win10-11-x64-portatil.exe` (sem instalar).
            - Windows 7, 8 ou 32 bits: os arquivos `...-legado-win7-a-11-...` (`x64` = 64 bits, `ia32` = 32 bits).

            Na primeira abertura o aplicativo pede o nome da loja e a senha do administrador — os dois opcionais (sem senha, tudo fica livre).
            Para sair: Ctrl+Shift+Q (e a senha, se houver).
            O Windows pode avisar "O Windows protegeu o computador" (aplicativo sem assinatura paga): Mais informações → Executar assim mesmo.
            Histórico completo: CHANGELOG.md.
          files: arquivos/**/*.exe
          fail_on_unmatched_files: true
